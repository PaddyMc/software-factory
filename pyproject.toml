[project]
name = "software-factory"
version = "0.3.0"
description = "Software factory: plan -> build -> review -> verify agents per task contract, ending in a PR only when deterministic gates pass"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6",
    "langchain>=1.4,<2",
    "langgraph>=1.2,<2",
    "langchain-anthropic>=1.7,<2",
    "langchain-openai>=1.6,<2",
    "langchain-openrouter>=0.2,<1",
]

[project.scripts]
factory = "factory.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["factory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
