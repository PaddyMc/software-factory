# Software factory settings for this repository. Every key is optional; see the
# factory's docs/reference.md ("Configure a project") for the full reference.

# Names the state directory: ~/.local/share/factory/<name> (override with `home:` or $FACTORY_HOME).
name: "software-factory"

# Markdown files holding task contracts (fenced ```yaml lists), and globs never read as backlog.
plans: ["docs/plans/**/*.md"]
exclude: []

# Paths a `test` step may write (globs); required by a flow that has one.
# strict's tests are committed before the build, must fail first, and are locked by acceptance_untouched.
test_paths: ["tests/**"]

# Repository guidance appended to every agent's system prompt: the first file that exists.
guidance: ["AGENTS.md", "CLAUDE.md"]

# Uncomment to require a session log entry (<dir>/<today>-<task id>.md) in every task.
session_log: docs/sessions

# Uncomment to require every task to add a new end-to-end test, and to run it.
# Not used here: the end-to-end tests (CLI runs with a scripted model) live beside the unit tests in
# tests/, and each contract's verification names the new tests it adds.

# Commands for the unit_tests gate (omit for none).
unit_tests: ["uv run pytest -q"]

# Models and step limits per role (plan, test, build, review, verify), over the shipped prompts' defaults.
# A whole prompt can be replaced with .factory/agents/<planner|tester|builder|reviewer|verifier>.md.
# Every role is pinned, so this repository doesn't change models when the shipped defaults do.
models:
  plan: "openrouter:z-ai/glm-5.3"
  test: "openrouter:z-ai/glm-5.3"           # not the builder's model: the tests that decide come from another model
  build: "openrouter:moonshotai/kimi-k3.1-pro"
  review: "openrouter:z-ai/glm-5.3"         # deepseek-v4-pro left 4 of 26 reviews without a VERDICT line
  verify: "openrouter:deepseek/deepseek-v4-flash-0731"
# max_steps: {build: 150}

# Agent flows: named step lists, chosen with `flow:` or per run with `factory run --flow NAME`.
# The built-in `default` is plan, build, review, gates, verify. Steps follow
# [plan]? [test]? build+ (review | gates)* [verify]?; a gates step goes after the last review when omitted.
# strict: test step, resumed builds, gates first, a proving review.
#   test (map, trim, nudge) → build (map, trim, nudge, resume) → gates → review (prove, trim) → verify
# The tester writes failing tests from the contract on another model, the builder can't change them,
# and a reviewer's CHANGES needs a reproduced failure or a scope finding.
flow: strict
flows:
  gates-first:              # the board's best before strict (81% first-attempt pass). Use it for docs-only
    - plan                  # tasks, whose test commands have nothing to turn red: --flow gates-first
    - build
    - gates
    - review
    - verify
  lean:                     # small, low-risk tasks: no planner and no verifier report; the gates still decide
    - build
    - review

# Extra regexes the agents' `run` tool refuses (git push/commit, sudo, gh, terraform apply… are built in).
# A contract whose verification runs one is done by hand: `factory run` refuses it.
# denied_commands: ["\\bkubectl\\s+delete\\b"]

# Directories the agents may also read (never write) by absolute path: dependency sources.
# The defaults are Rust sources; this repository's dependencies are in each worktree's .venv.
dependency_sources: []

# What the bubblewrap sandbox exposes; the defaults mount rustup/cargo and uv if present.
# Only what a uv project needs: uv and its Pythons read-only, and the shared uv cache. The Rust
# mounts (~/.rustup, and ~/.cargo writable) are left out, so an agent can't write to ~/.cargo/bin.
sandbox:
  ro_binds: ["~/.local/bin", "~/.local/share/uv"]
  rw_binds: []
  hide: []
  path: ["~/.local/bin"]
  env: {UV_CACHE_DIR: "{cache}/uv"}
  offline_env: {UV_OFFLINE: "1"}
  cache_dirs: ["uv"]
